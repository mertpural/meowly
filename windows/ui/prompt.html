<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Meowly</title>
<link rel="stylesheet" href="tonti.css">
<style>
  /* Mac: Tonti/CatNameUI.swift → CatNamePrompt.PromptView (380×300, 24 kenar boşluğu, 14 aralık). */
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
  #root { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; color: var(--ink); }
  #root img { height: 78px; }
  .t { font-size: 14px; font-weight: 700; text-align: center; }
  .s { font-size: 11px; color: var(--sub); text-align: center; }
  .nb { width: 200px; display: inline-flex; }
  .nb input { width: 100%; border: 0; outline: none; background: none; font: 700 14px var(--mono); color: var(--ink); text-align: center; padding: 6px 8px; }
  .nb input::placeholder { color: var(--sub); font-weight: 400; }
</style>
</head>
<body>
<div id="root">
  <img class="px-img" src="img/cat/content.png" alt="">
  <div class="t" data-k="Merhaba! Benim adım ne olsun?">Merhaba! Benim adım ne olsun?</div>
  <div class="s" data-k="Sonra ayarlardan değiştirebilirsin.">Sonra ayarlardan değiştirebilirsin.</div>
  <span class="px nb"><input id="name" maxlength="20" value="Tonti" placeholder="Tonti" spellcheck="false"></span>
  <button class="btn px on" id="ok" data-k="TAMAM">TAMAM</button>
</div>
<script src="common.js"></script>
<script>
  // Hiçbir şey okunmaz ya da gönderilmez: ad yalnızca bu bilgisayardaki ayar dosyasına yazılır.
  (async () => {
    await T.load();
    const st = await invoke("get_state");
    setTheme(st && st.dark);
    document.querySelectorAll("[data-k]").forEach(e => { e.textContent = T.t(e.dataset.k); });
    const inp = document.getElementById("name");
    inp.focus(); inp.select();
    let sent = false;
    const done = () => { if (sent) return; sent = true; invoke("name_done", { name: inp.value }); };
    document.getElementById("ok").addEventListener("click", done);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") done(); });
  })();
</script>
</body>
</html>
